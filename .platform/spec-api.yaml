apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: spec-teste
  title: spec-teste
  publishedAt: "2025-02-04 19:23:25"
  description: Consulte CEPs de todo o Brasil.
  tags: []
spec:
  type: openapi
  lifecycle: production
  owner: consumer
  definition: |-
    openapi: 3.0.1
    info:
        title: ViaCEP
        description: Consulte CEPs de todo o Brasil.
        termsOfService: http://swagger.io/terms/
        contact:
            email: apiteam@swagger.io
        license:
            name: Apache 2.0
            url: http://www.apache.org/licenses/LICENSE-2.0.html
        version: 1.0.0
    externalDocs:
        description: Find out more about Swagger
        url: http://swagger.io
    servers:
        - url: https://overview.platform.vee.codes/spec-teste
    tags:
        - name: Address
          description: Getting zip-code informations
          externalDocs:
            description: Find out more
            url: http://swagger.io
    x-kong-rate-limiting:
        name: rate-limiting
        enabled: true
        config:
            error_code: 429
            error_message: API rate limit exceeded
            sync_rate: -1
            redis_timeout: 2000
            redis_database: 0
            redis_ssl_verify: false
            redis_ssl: false
            redis_port: 6379
            hide_client_headers: false
            fault_tolerant: true
            policy: local
            limit_by: consumer
            redis:
                database: 0
                ssl: false
                ssl_verify: false
                password: null
                port: 6379
                server_name: null
                timeout: 2000
                host: null
                username: null
            minute: 5
    paths:
        /ws/{zip-code}/json:
            get:
                tags:
                    - Address
                summary: Find Address by zip-code
                description: Returns a single Address
                operationId: getAddressByzip-code
                parameters:
                    - name: zip-code
                      in: path
                      description: zip-code to search
                      required: true
                      schema:
                        type: string
                responses:
                    '200':
                        description: successful operation
                        content:
                            application/json:
                                schema:
                                    $ref: '#/components/schemas/Address'
                    '400':
                        description: Invalid zip-code supplied
                        content: {}
                    '404':
                        description: Address not found
                        content: {}
    components:
        schemas:
            Address:
                type: object
                properties:
                    cep:
                        type: string
                    logradouro:
                        type: string
                    complemento:
                        type: string
                    bairro:
                        type: string
                    localidade:
                        type: string
                    uf:
                        type: string
                    ibge:
                        type: string
                    gia:
                        type: string
                    ddd:
                        type: string
                    siafi:
                        type: string
